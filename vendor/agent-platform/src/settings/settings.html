<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 设置中心</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#21352e;font:14px/1.65 system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:220px;padding:28px 18px;background:white;border-right:1px solid #e3e8e3}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;color:#69786f;border-radius:7px}nav button.active{background:#eaf2ed;color:#24634c;font-weight:600}header{padding:23px 36px;border-bottom:1px solid #e3e8e3;background:white}.shell{margin-left:220px}main{padding:32px 36px;max-width:1150px}h1{font-size:28px;margin:0}h2{font-size:17px}p{color:#78857d}.card{background:white;border:1px solid #e3e8e3;border-radius:10px;padding:23px;margin:22px 0}.btn{border:1px solid #d7dfd8;border-radius:6px;background:white;padding:9px 15px;color:#244b37;margin:4px}.primary{background:#24634c;color:white}input,textarea,select{display:block;width:100%;padding:10px 12px;margin:6px 0 17px;border:1px solid #dce2dc;border-radius:6px}textarea{min-height:150px}button:disabled{opacity:.5}.row{padding:16px 0;border-bottom:1px solid #edf0eb}.answer,pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#24634c}dialog{border:1px solid #e3e8e3;border-radius:10px;width:min(750px,90vw);max-height:85vh;overflow:auto;padding:25px}.toast{position:fixed;bottom:25px;right:25px;background:#244d37;color:white;padding:14px 20px;border-radius:7px}.hidden{display:none}@media(max-width:700px){aside{position:static;width:auto;padding:15px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.shell{margin:0}main{padding:25px 18px}}
</style><body><aside><h2>α　Agent Platform</h2><nav id="nav"></nav><p>配置与知识按产品隔离</p><a href="/">返回智慧农场</a></aside><div class="shell"><header>智慧农场 / Agent 设置中心 · 本地实例</header><main id="main"></main></div><dialog id="detail"><div id="detailBody"></div><button class="btn" onclick="document.querySelector('dialog').close()">关闭</button></dialog><div id="toast" role="status" class="toast hidden"></div><script>
const menu={overview:'概览',models:'模型连接',agent:'Agent 与运行时',tools:'工具与权限',skills:'技能',mcp:'MCP',knowledge:'知识库',qa:'知识库问答',channels:'消息通道',schedules:'定时任务',runs:'运行记录',diagnostics:'诊断与维护'};
let page='overview',epoch=0,dirty=false,timer;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(title,body)=>'<div class="card"><h2>'+esc(title)+'</h2>'+body+'</div>',btn=(t,id)=>'<button type="button" class="btn" id="'+id+'">'+t+'</button>',field=(t,id,v='',type='text')=>'<label>'+t+'<input id="'+id+'" type="'+type+'" value="'+esc(v)+'"></label>';
function tell(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),6000)}
async function api(path,method='GET',data){const r=await fetch('/api/agent/v1'+path,{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const x=await r.json();if(!r.ok)throw Error(x.error||'请求失败');return x}
function bind(id,fn){$('#'+id)?.addEventListener('click',async()=>{const b=$('#'+id);b.disabled=true;try{await fn()}catch(e){tell(e.message)}finally{b.disabled=false}})}
async function render(){const ticket=++epoch;$('#nav').innerHTML=Object.entries(menu).map(([k,v])=>'<button data-page="'+k+'" class="'+(page===k?'active':'')+'">'+v+'</button>').join('');$('#nav').onclick=async e=>{const k=e.target.dataset.page;if(k&&(!dirty||(await appConfirm('放弃未保存修改？')))){dirty=false;page=k;location.hash=k;render()}};$('#main').innerHTML='<h1>'+menu[page]+'</h1><p>正在加载…</p>';try{const s=await api('/status');if(ticket!==epoch)return;const c=s.config;let html='';
if(page==='overview')html=card('当前实例','<p>模型：'+esc(c.model||'未选择')+' · '+(c.modelConfigured?'凭据已配置':'尚未配置凭据')+'</p><p>知识库：'+s.knowledgePages+' 篇资料</p><p>微信：'+(s.connector.active?'已激活':'未激活')+'</p>')+card('开始使用','配置模型 → 导入 Markdown / 文本 → 知识库问答。<p>问答独立运行，无需 Luban。资料与问答记录已持久保存。</p>');
if(page==='models'||page==='agent')html=card('模型与运行配置','<form id="config"><label>Provider<select id="provider"><option value="openai-compatible">OpenAI Compatible</option><option value="anthropic">Anthropic Messages</option></select></label>'+field('模型地址（可留空使用默认地址）','baseUrl',c.baseUrl)+field('默认模型','model',c.model)+field('API Key','key','','password')+'<p>'+(c.modelConfigured?'凭据已配置，留空保留。':'尚未配置凭据。')+' 密钥仅当前进程有效；重启需重新填写或设置环境变量。</p>'+field('问答超时（秒，5–600）','timeout',c.timeoutSeconds,'number')+btn('保存配置','save')+btn('测试连接','test')+btn('清除凭据','clear')+'</form>')+card('运行方式','库内嵌 · Agent Platform<p>普通配置持久保存，下一次问答生效。密钥不写入普通配置。</p>');
if(page==='knowledge'){const d=await api('/knowledge');if(ticket!==epoch)return;html=card('资料库',d.items.length?d.items.map(p=>'<div class="row"><strong>'+esc(p.title)+'</strong><p>'+p.size+' 字符 · '+esc(p.created_at)+'</p><button class="btn" data-read="'+p.id+'">查看</button><button class="btn" data-delete="'+p.id+'">删除</button></div>').join(''):'尚无资料')+card('导入资料',field('标题','title')+'<label>Markdown / 纯文本正文<textarea id="content"></textarea></label><input id="file" type="file" accept=".md,.txt"><p>每篇最多 100 KB，保留完整原文。</p>'+btn('保存资料','import'));}
if(page==='qa')html=card('向知识库提问','<p>基于相关资料回答，来源可打开核对。未命中不调用模型。</p><textarea id="question" maxlength="4000" placeholder="请输入问题"></textarea>'+btn('提问','ask')+'<div id="result" aria-live="polite"></div>');
if(page==='channels')html=card('微信连接','<p>状态：'+(s.connector.active?'已激活':'未激活')+'</p><p>Connector：'+esc(s.connector.connectorId||'未接入')+'</p><p>账号：'+esc(s.connector.accountId||'未知')+'</p><p>账号识别和连接控制尚未挂载到此管理页面。</p>');
if(page==='runs'){const d=await api('/runs');if(ticket!==epoch)return;html=card('知识库问答记录',d.items.length?d.items.map(r=>'<div class="row"><strong>'+esc(r.question)+'</strong><p>'+esc(r.created_at)+' · '+esc(r.status)+'</p><details><summary>回答与来源</summary><div class="answer">'+esc(r.answer)+'</div>'+refs(r.sources)+'</details></div>').join(''):'暂无记录');}
if(page==='diagnostics')html=card('实例诊断','<pre>'+esc(JSON.stringify(s,null,2))+'</pre><p>真实状态，不返回密钥。</p>');
if(['tools','skills','mcp','schedules'].includes(page))html=card(menu[page]+'管理','<p>此管理模块尚未接入当前实例。</p><p>知识库问答只使用模型与只读资料检索，不注册业务写工具。</p>');
if(page==='knowledge'){
const m=await api('/knowledge/manage');if(ticket!==epoch)return;
html=card('LLM Wiki · 目录知识库','<label>知识库状态<select id="kbEnabled"><option value="true">启用</option><option value="false">停用</option></select></label>'+field('源目录（本机绝对路径，只读扫描）','kbDirectory',m.directory)+'<p>支持 MD、TXT、JSON、YAML、CSV、TSV。PDF、Office 和图片暂不支持，扫描后会记录跳过原因。</p>'+btn('保存目录与状态','kbSave')+btn('立即更新','kbBuild')+btn('完整重建','kbRebuild')+btn('浏览 Wiki','kbWiki')+'<p>来源 '+m.sourceCount+' 项 · 目录来源页 '+m.pageCount+' 篇 · 跳过 '+m.skippedCount+' 项</p><p>最近成功更新：'+esc(m.updatedAt||'尚未构建')+' · '+(m.busy?'构建中':'空闲')+'</p><p>当前浏览器版需手动更新；构建失败保留上一版。清空目录只解除绑定，不删除已收录资料。</p>')+card('构建日志',m.logs.length?m.logs.map(l=>'<div class="row">'+esc(l.at)+' · '+esc(l.status)+'<br>'+esc(l.detail)+'</div>').join(''):'暂无构建记录')+card('跳过的来源',m.files.filter(f=>f.status==='skipped').map(f=>'<div>'+esc(f.path)+' — '+esc(f.reason)+'</div>').join('')||'无')+html;
setTimeout(()=>{if(page==='knowledge'&&$('#kbEnabled'))$('#kbEnabled').value=String(m.enabled)},0);
}
$('#main').innerHTML='<h1>'+menu[page]+'</h1><p>智慧农场实例 · 独立配置，统一体验</p>'+html;
bind('kbSave',async()=>{await api('/knowledge/manage','PATCH',{directory:$('#kbDirectory').value,enabled:$('#kbEnabled').value==='true'});tell('目录与状态已保存');await render()});
async function buildWiki(full){if(full&&!(await appConfirm('根据已保存源目录完整重建？手动导入的资料会保留。')))return;tell('正在扫描与构建，请稍候');await api('/knowledge/build','POST',{full});tell('Wiki 更新完成');await render()}
bind('kbBuild',()=>buildWiki(false));bind('kbRebuild',()=>buildWiki(true));
bind('kbWiki',async()=>{const w=await api('/knowledge/wiki');$('#detailBody').innerHTML='<h2>LLM Wiki 知识浏览</h2><details open><summary>知识库索引</summary><pre>'+esc(w.index)+'</pre></details><details><summary>知识库概览</summary><pre>'+esc(w.overview)+'</pre></details><h3>来源目录</h3>'+w.pages.map(p=>'<div><button class="btn" data-wiki-read="'+p.id+'">'+esc(p.title)+'</button></div>').join('')+'<div id="wikiPage"></div>';$('#detail').showModal()});
$('#config')?.addEventListener('submit',e=>e.preventDefault());if($('#provider'))$('#provider').value=c.provider;$('#config')?.addEventListener('input',()=>dirty=true);
bind('save',async()=>{await api('/config','PATCH',{provider:$('#provider').value,baseUrl:$('#baseUrl').value,model:$('#model').value,apiKey:$('#key').value,timeoutSeconds:Number($('#timeout').value)});dirty=false;tell('普通配置已保存，密钥仅本次运行有效');await render()});
bind('test',async()=>{if(dirty)throw Error('请先保存配置');tell('正在测试，将发出模型请求');await api('/test','POST',{});tell('模型返回文本，连接成功')});bind('clear',async()=>{if((await appConfirm('清除当前进程的模型凭据？'))){await api('/config','PATCH',{clearKey:true});await render()}});
bind('import',async()=>{await api('/knowledge','POST',{title:$('#title').value,content:$('#content').value});tell('资料已保存');await render()});
$('#file')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>100000)return tell('文件超过 100 KB');$('#content').value=await f.text();if(!$('#title').value)$('#title').value=f.name});
bind('ask',async()=>{const q=$('#question').value;$('#result').textContent='检索资料并生成回答…';try{const r=await api('/ask','POST',{question:q});if(ticket===epoch)$('#result').innerHTML='<div class="card answer">'+esc(r.answer)+'</div><p>检索来源（请核对原文）</p>'+refs(r.sources)}catch(e){if(ticket===epoch)$('#result').textContent=e.message}});
}catch(e){if(ticket===epoch)$('#main').innerHTML='<h1>'+menu[page]+'</h1><div class="card">'+esc(e.message)+'</div>'}}
function refs(s){return s.map(p=>'<button class="btn" data-read="'+p.id+'">['+p.number+'] '+esc(p.title)+'</button>').join('')}
$('#main').addEventListener('click',async e=>{try{if(e.target.dataset.read){const p=await api('/knowledge/'+e.target.dataset.read);$('#detailBody').innerHTML='<h2>'+esc(p.title)+'</h2><pre>'+esc(p.content)+'</pre>';$('#detail').showModal()}if(e.target.dataset.delete&&(await appConfirm('删除资料？历史问答保留，原文将不可查看。'))){await api('/knowledge/'+e.target.dataset.delete,'DELETE');await render()}}catch(err){tell(err.message)}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});if(menu[location.hash.slice(1)])page=location.hash.slice(1);render();
$('#detailBody').addEventListener('click',async e=>{if(!e.target.dataset.wikiRead)return;try{const p=await api('/knowledge/'+e.target.dataset.wikiRead);$('#wikiPage').innerHTML='<h3>'+esc(p.title)+'</h3><pre>'+esc(p.content)+'</pre>'}catch(err){tell(err.message)}});
</script></body></html>
